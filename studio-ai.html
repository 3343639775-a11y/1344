<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio AI</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Noto+Sans+SC:wght@400;600;700&display=swap');*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;background:#f8f8fb;color:#20202a;font-family:'DM Sans','Noto Sans SC',sans-serif}aside{width:250px;background:white;border-right:1px solid #e8e8ef;padding:26px 16px;display:flex;flex-direction:column;gap:7px}aside b{font-size:19px;margin:0 10px 20px}aside button{background:#20202a;color:white;border:0;border-radius:9px;padding:12px;cursor:pointer}aside p{font-size:11px;color:#aaa;margin:22px 11px 4px;text-transform:uppercase}aside a{padding:11px 12px;border-radius:8px;color:#777;text-decoration:none;font-size:14px}aside a.active{background:#efecff;color:#5c4ad9;font-weight:600}.user{margin-top:auto;border-top:1px solid #eee;padding:18px 8px;font-size:13px}.user small{color:#aaa}main{flex:1;display:flex;flex-direction:column}header{padding:38px 8vw 20px}header small{color:#6555df;font-weight:600}h1{font-size:25px;margin:8px 0}.chat{flex:1;max-width:860px;width:100%;margin:auto;padding:20px 30px;overflow:auto}.welcome{text-align:center;margin-top:13vh;color:#7262e8;font-size:32px}.welcome h2{color:#222;font-size:26px;margin:16px 0 8px}.welcome p{color:#90909b;font-size:15px}.cards{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:30px}.cards button{background:white;border:1px solid #e4e4ec;border-radius:10px;padding:13px;color:#5b5b66;cursor:pointer}.wrap{max-width:860px;width:100%;margin:auto;padding:12px 30px 25px}.composer{background:#fff;border:1px solid #dddde7;border-radius:14px;padding:14px}.composer textarea{width:100%;border:0;resize:none;outline:0;font:inherit;min-height:28px}.composer div{display:flex;justify-content:space-between;align-items:center;color:#999;font-size:13px;margin-top:8px}.composer button{background:#6957e8;color:white;border:0;border-radius:8px;width:32px;height:32px;font-size:18px}.wrap em{display:block;text-align:center;color:#aaa;font-size:11px;font-style:normal;margin-top:10px}.message{display:flex;margin:20px 0}.message.user{justify-content:flex-end}.bubble{padding:13px 16px;border-radius:14px;background:white;border:1px solid #e7e7ee;max-width:75%;line-height:1.6}.user .bubble{background:#6957e8;color:white;border:0}
</style></head><body><aside><b>✦ Studio AI</b><button id="new">＋ 新建对话</button><p>工作台</p><a class="active">◫　AI 对话</a><a href="#" id="imageTab">◇　图片创作</a><a href="#" id="galleryTab">▧　作品库</a><p>最近对话</p><a>产品发布创意 brainstorm</a><a>小红书文案</a><div class="user">林小满　<small>免费版</small></div></aside><main><header><small>AI 对话</small><h1>今天想聊点什么？</h1></header><section id="chat"><div class="welcome">✦<h2>你好，我是你的 AI 创作伙伴</h2><p>从一个想法开始，一起把它变成现实。</p><div class="cards"><button data-p="帮我制定一个高效的学习计划">制定一个学习计划　→</button><button data-p="帮我写一篇小红书文案">写一篇小红书文案　→</button><button data-p="给我的产品想 5 个名字">为产品取个好名字　→</button></div></div></section><section id="imagePanel" style="display:none;max-width:860px;width:100%;margin:auto;padding:20px 30px"><h2>图片创作</h2><p style="color:#888">描述你想创作的画面，或上传参考图。</p><textarea id="prompt" placeholder="例如：黄昏海边的未来城市，电影感，细节丰富" style="width:100%;min-height:100px;padding:14px;border:1px solid #ddd;border-radius:10px;font:inherit"></textarea><div style="margin-top:12px;display:flex;gap:10px"><button id="upload" style="padding:10px 14px;border:1px solid #ddd;border-radius:8px;background:#fff">＋ 上传参考图</button><button id="generate" style="padding:10px 18px;border:0;border-radius:8px;background:#6957e8;color:#fff">生成图片</button></div><div id="result" style="margin-top:20px"></div></section><div class="wrap"><div class="composer"><textarea id="input" placeholder="输入消息，按 Enter 发送"></textarea><div><span>＋　◎ 联网搜索　◇ 深度思考</span><button id="send">↑</button></div></div><em>AI 可能会犯错，请核实重要信息</em></div></main><script>const i=document.querySelector('#input'),s=document.querySelector('#send'),c=document.querySelector('#chat');function send(){let t=i.value.trim();if(!t)return;document.querySelector('.welcome')?.remove();let u=document.createElement('div');u.className='message user';u.innerHTML='<div class="bubble">'+t.replace(/</g,'&lt;')+'</div>';c.append(u);i.value='';setTimeout(()=>{let b=document.createElement('div');b.className='message';b.innerHTML='<div class="bubble">✦ 这是一个演示回复。接入真实模型后，我可以继续思考、检索资料并协助完成创作。</div>';c.append(b);c.scrollTop=c.scrollHeight},450)}s.onclick=send;i.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};document.querySelectorAll('[data-p]').forEach(x=>x.onclick=()=>{i.value=x.dataset.p;i.focus()});document.querySelector('#new').onclick=()=>location.reload();
const imageTab=document.querySelector('#imageTab'),galleryTab=document.querySelector('#galleryTab'),imagePanel=document.querySelector('#imagePanel'),chatPanel=document.querySelector('#chat');
imageTab.onclick=e=>{e.preventDefault();chatPanel.style.display='none';document.querySelector('.wrap').style.display='none';imagePanel.style.display='block'};
galleryTab.onclick=e=>{e.preventDefault();imagePanel.style.display='none';chatPanel.style.display='block';document.querySelector('.wrap').style.display='block';alert('作品库即将开放，生成的图片会保存在这里。')};
document.querySelector('#generate').onclick=()=>{const p=document.querySelector('#prompt').value.trim();if(!p)return alert('请先输入创作描述');document.querySelector('#result').innerHTML='<div style="padding:28px;border-radius:12px;background:linear-gradient(135deg,#27213f,#8b6be8);color:#fff;min-height:180px;display:grid;place-items:center;text-align:center">✦<br>'+p+'<br><small style="opacity:.7">演示预览 · 接入图像模型后生成真实图片</small></div>'};
</script></body></html>
