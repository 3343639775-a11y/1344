<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio AI</title><link rel="stylesheet" href="styles.css"></head><body><aside><b>✦ Studio AI</b><button id="new">＋ 新建对话</button><p>工作台</p><a class="active">◫　AI 对话</a><a href="#" id="imageTab">◇　图片创作</a><a href="#" id="galleryTab">▧　作品库</a><p>最近对话</p><a>产品发布创意 brainstorm</a><a>小红书文案</a><div class="user">林小满　<small>免费版</small></div></aside><main><header><small>AI 对话</small><h1>今天想聊点什么？</h1></header><section id="chat"><div class="welcome">✦<h2>你好，我是你的 AI 创作伙伴</h2><p>从一个想法开始，一起把它变成现实。</p><div class="cards"><button data-p="帮我制定一个高效的学习计划">制定一个学习计划　→</button><button data-p="帮我写一篇小红书文案">写一篇小红书文案　→</button><button data-p="给我的产品想 5 个名字">为产品取个好名字　→</button></div></div></section><section id="imagePanel" style="display:none;max-width:860px;width:100%;margin:auto;padding:20px 30px"><h2>图片创作</h2><p style="color:#888">描述你想创作的画面，或上传参考图。</p><textarea id="prompt" placeholder="例如：黄昏海边的未来城市，电影感，细节丰富" style="width:100%;min-height:100px;padding:14px;border:1px solid #ddd;border-radius:10px;font:inherit"></textarea><div style="margin-top:12px;display:flex;gap:10px"><button id="upload" style="padding:10px 14px;border:1px solid #ddd;border-radius:8px;background:#fff">＋ 上传参考图</button><button id="generate" style="padding:10px 18px;border:0;border-radius:8px;background:#6957e8;color:#fff">生成图片</button></div><div id="result" style="margin-top:20px"></div></section><div class="wrap"><div class="composer"><textarea id="input" placeholder="输入消息，按 Enter 发送"></textarea><div><span>＋　◎ 联网搜索　◇ 深度思考</span><button id="send">↑</button></div></div><em>AI 可能会犯错，请核实重要信息</em></div></main><script src="app.js"></script></body></html>
